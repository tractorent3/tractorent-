<script>
  window.onerror = function (msg, url, line, col, error) {
    console.error('[TractoRent]', msg, 'ligne', line, 'colonne', col, error);
    var box = document.getElementById('error-box');
    var resetBtn = document.getElementById('error-reset-btn');
    if (!box) return false;
    var isDebug = /(?:^|[?&])debug=1(?:&|$)/.test(window.location.search);
    box.style.display = 'block';
    box.textContent = isDebug
      ? 'ERREUR : ' + msg + '\n(ligne ' + line + ', colonne ' + col + ')\n\n' + (error && error.stack ? error.stack : '')
      : "Une erreur est survenue. Merci de réessayer ou de nous contacter si le problème persiste.";
    if (resetBtn) resetBtn.style.display = 'inline-block';
    return false;
  };
  function tractorentHardReset() {
    try { localStorage.clear(); } catch (e) {}
    try {
      if (window.caches && caches.keys) {
        caches.keys().then(function (names) { names.forEach(function (n) { caches.delete(n); }); });
      }
    } catch (e) {}
    location.reload(true);
  }
</script>

 days.","ru":"⚠️ Продолжительность должна быть от 1 до 365 дней.","de":"⚠️ Die Mietdauer muss zwischen 1 und 365 Tagen liegen.","fr":"⚠️ La durée doit être comprise entre 1 et 365 jours.","pl":"⚠️ Czas trwania musi wynosić od 1 do 365 dni.","uk":"⚠️ Тривалість має бути від 1 до 365 днів.","it":"⚠️ La durata deve essere compresa tra 1 e 365 giorni.","ro":"⚠️ Durata trebuie să fie între 1 și 365 de zile.","cs":"⚠️ Doba trvání musí být mezi 1 a 365 dny.","hu":"⚠️ Az időtartamnak 1 és 365 nap között kell lennie.","es":"⚠️ La duración debe estar entre 1 y 365 días."},"err_conflict":{"en":"❌ This tractor is already booked for part of this period. Please choose other dates.","ru":"❌ Этот трактор уже забронирован на часть этого периода. Выберите другие даты.","de":"❌ Dieser Traktor ist für einen Teil dieses Zeitraums bereits gebucht. Bitte wählen Sie andere Termine.","fr":"❌ Ce tracteur est déjà réservé sur une partie de cette période. Choisissez d'autres dates.","pl":"❌ Ten ciągnik jest już zarezerwowany na część tego okresu. Wybierz inne daty.","uk":"❌ Цей трактор вже заброньований на частину цього періоду. Оберіть інші дати.","it":"❌ Questo trattore è già prenotato per parte di questo periodo. Scegli altre date.","ro":"❌ Acest tractor este deja rezervat pentru o parte din această perioadă. Alege alte date.","cs":"❌ Tento traktor je na část tohoto období již rezervován. Zvolte prosím jiná data.","hu":"❌ Ez a traktor már foglalt erre az időszak egy részére. Válasszon másik dátumot.","es":"❌ Este tractor ya está reservado para parte de este período. Elige otras fechas."},"success_emailSent_tpl":{"en":"✅ Request sent! You will receive the bank details by email shortly. Booking reference: #{id} (keep it: you will need it to download your contract once the deposit payment is confirmed).","ru":"✅ Заявка отправлена! Реквизиты для оплаты придут на email в ближайшее время. Номер бронирования: #{id} (сохраните его: он понадобится для скачивания договора после подтверждения оплаты залога).","de":"✅ Anfrage gesendet! Sie erhalten die Bankdaten in Kürze per E-Mail. Buchungsnummer: #{id} (bitte aufbewahren: Sie benötigen sie zum Herunterladen Ihres Vertrags nach Bestätigung der Kautionszahlung).","fr":"✅ Demande transmise ! Vous recevrez l'IBAN par email sous peu. Référence de réservation : #{id} (conservez-la : elle vous servira à télécharger votre contrat dès la confirmation du paiement de la caution).","pl":"✅ Zgłoszenie wysłane! Wkrótce otrzymasz dane do przelewu na e-mail. Numer rezerwacji: #{id} (zachowaj go: będzie potrzebny do pobrania umowy po potwierdzeniu płatności kaucji).","uk":"✅ Запит надіслано! Незабаром ви отримаєте банківські реквізити на email. Номер бронювання: #{id} (збережіть його: він знадобиться для завантаження договору після підтвердження оплати застави).","it":"✅ Richiesta inviata! Riceverai i dati bancari via email a breve. Riferimento prenotazione: #{id} (conservalo: ti servirà per scaricare il contratto dopo la conferma del pagamento della caparra).","ro":"✅ Cerere trimisă! Vei primi datele bancare prin email în curând. Referință rezervare: #{id} (păstreaz-o: vei avea nevoie de ea pentru a descărca contractul după confirmarea plății garanției).","cs":"✅ Žádost odeslána! Platební údaje obdržíte brzy e-mailem. Referenční číslo rezervace: #{id} (uschovejte si ho: budete ho potřebovat ke stažení smlouvy po potvrzení platby kauce).","hu":"✅ A kérelem elküldve! Hamarosan e-mailben megkapja a banki adatokat. Foglalási hivatkozás: #{id} (őrizze meg: erre lesz szüksége a szerződés letöltéséhez, miután a kaució befizetése megerősítést nyer).","es":"✅ ¡Solicitud enviada! Recibirás los datos bancarios por email en breve. Referencia de reserva: #{id} (guárdala: la necesitarás para descargar tu contrato en cuanto se confirme el pago de la fianza)."},"warn_emailFailed_tpl":{"en":"⚠️ Request recorded (reference #{id}), but the email could not be sent automatically. We will contact you.","ru":"⚠️ Заявка зарегистрирована (номер #{id}), но письмо не удалось отправить автоматически. Мы свяжемся с вами.","de":"⚠️ Anfrage gespeichert (Referenz #{id}), aber die E-Mail konnte nicht automatisch versendet werden. Wir melden uns bei Ihnen.","fr":"⚠️ Demande enregistrée (référence #{id}), mais l'email n'a pas pu partir automatiquement. Nous vous recontactons.","pl":"⚠️ Zgłoszenie zapisane (nr #{id}), ale e-mail nie mógł zostać wysłany automatycznie. Skontaktujemy się z Tobą.","uk":"⚠️ Запит зареєстровано (номер #{id}), але лист не вдалося надіслати автоматично. Ми зв'яжемося з вами.","it":"⚠️ Richiesta registrata (riferimento #{id}), ma l'email non è stata inviata automaticamente. Ti ricontatteremo.","ro":"⚠️ Cerere înregistrată (referință #{id}), dar emailul nu a putut fi trimis automat. Te vom contacta noi.","cs":"⚠️ Žádost byla zaznamenána (referenční číslo #{id}), ale e-mail se nepodařilo odeslat automaticky. Budeme vás kontaktovat.","hu":"⚠️ A kérelem rögzítve (hivatkozás: #{id}), de az e-mailt nem sikerült automatikusan elküldeni. Fel fogjuk venni Önnel a kapcsolatot.","es":"⚠️ Solicitud registrada (referencia #{id}), pero el email no se pudo enviar automáticamente. Nos pondremos en contacto contigo."},"success_demoMode_tpl":{"en":"✅ Request recorded (reference #{id})! Use the contact button to finalize with the agency.","ru":"✅ Заявка зарегистрирована (номер #{id})! Используйте кнопку связи, чтобы завершить оформление с агентством.","de":"✅ Anfrage gespeichert (Referenz #{id})! Nutzen Sie die Kontakt-Schaltfläche, um mit der Agentur abzuschließen.","fr":"✅ Demande enregistrée (référence #{id}) ! Utilisez le bouton de contact pour finaliser avec l'agence.","pl":"✅ Zgłoszenie zapisane (nr #{id})! Użyj przycisku kontaktu, aby dokończyć proces z agencją.","uk":"✅ Запит зареєстровано (номер #{id})! Скористайтеся кнопкою контакту, щоб завершити оформлення з агенцією.","it":"✅ Richiesta registrata (riferimento #{id})! Usa il pulsante di contatto per finalizzare con l'agenzia.","ro":"✅ Cerere înregistrată (referință #{id})! Folosește butonul de contact pentru a finaliza cu agenția.","cs":"✅ Žádost byla zaznamenána (referenční číslo #{id})! Pomocí kontaktního tlačítka dokončete rezervaci s agenturou.","hu":"✅ A kérelem rögzítve (hivatkozás: #{id})! A kapcsolatfelvétel gombbal fejezze be a folyamatot az irodával.","es":"✅ ¡Solicitud registrada (referencia #{id})! Usa el botón de contacto para finalizar con la agencia."},"err_pdfNotLoaded":{"en":"⚠️ The PDF generator could not load. Please try again.","ru":"⚠️ Не удалось загрузить генератор PDF. Попробуйте снова.","de":"⚠️ Der PDF-Generator konnte nicht geladen werden. Bitte versuchen Sie es erneut.","fr":"⚠️ Le générateur de PDF n'a pas pu se charger. Réessayez.","pl":"⚠️ Nie udało się załadować generatora PDF. Spróbuj ponownie.","uk":"⚠️ Не вдалося завантажити генератор PDF. Спробуйте ще раз.","it":"⚠️ Impossibile caricare il generatore di PDF. Riprova.","ro":"⚠️ Generatorul de PDF nu s-a putut încărca. Încearcă din nou.","cs":"⚠️ Generátor PDF se nepodařilo načíst. Zkuste to znovu.","hu":"⚠️ A PDF-generátort nem sikerült betölteni. Próbálja újra.","es":"⚠️ No se pudo cargar el generador de PDF. Inténtalo de nuevo."},"terms_title":{"en":"Rental terms and conditions","ru":"Условия аренды","de":"Mietbedingungen","fr":"Conditions générales de location","pl":"Ogólne warunki najmu","uk":"Умови оренди","it":"Termini e condizioni di noleggio","ro":"Termenii și condițiile de închiriere","cs":"Obchodní podmínky pronájmu","hu":"Bérleti általános szerződési feltételek","es":"Términos y condiciones de alquiler"},"terms_closeAria":{"en":"Close","ru":"Закрыть","de":"Schließen","fr":"Fermer","pl":"Zamknij","uk":"Закрити","it":"Chiudi","ro":"Închide","cs":"Zavřít","hu":"Bezárás","es":"Cerrar"},"terms_s1_title":{"en":"1. Purpose","ru":"1. Предмет договора","de":"1. Gegenstand","fr":"1. Objet","pl":"1. Przedmiot umowy","uk":"1. Предмет договору","it":"1. Oggetto","ro":"1. Obiect","cs":"1. Předmět","hu":"1. Tárgy","es":"1. Objeto"},"terms_s1_body_tpl":{"en":"{siteName} rents out the tractors in its catalog for the duration and dates agreed upon at booking.","ru":"{siteName} сдаёт в аренду тракторы из своего каталога на срок и в даты, согласованные при бронировании.","de":"{siteName} vermietet die Traktoren aus seinem Katalog für den bei der Buchung vereinbarten Zeitraum und Termine.","fr":"{siteName} met en location les tracteurs de son catalogue pour la durée et aux dates convenues lors de la réservation.","pl":"{siteName} wynajmuje ciągniki ze swojego katalogu na okres i w terminach uzgodnionych podczas rezerwacji.","uk":"{siteName} здає в оренду трактори зі свого каталогу на строк і в дати, узгоджені під час бронювання.","it":"{siteName} noleggia i trattori del proprio catalogo per la durata e le date concordate al momento della prenotazione.","ro":"{siteName} închiriază tractoarele din catalogul său pentru durata și datele convenite la momentul rezervării.","cs":"{siteName} pronajímá traktory ze svého katalogu na dobu a v termínech dohodnutých při rezervaci.","hu":"A {siteName} a katalógusában szereplő traktorokat a foglaláskor egyeztetett időtartamra és dátumokra adja bérbe.","es":"{siteName} alquila los tractores de su catálogo por la duración y en las fechas acordadas al hacer la reserva."},"terms_s2_title":{"en":"2. Booking","ru":"2. Бронирование","de":"2. Buchung","fr":"2. Réservation","pl":"2. Rezerwacja","uk":"2. Бронювання","it":"2. Prenotazione","ro":"2. Rezervare","cs":"2. Rezervace","hu":"2. Foglalás","es":"2. Reserva"},"terms_s2_body":{"en":"Every request is confirmed after payment is received (bank details sent by email). The tractor is only reserved once payment is confirmed, not before.","ru":"Каждая заявка подтверждается после получения оплаты (реквизиты присылаются по email). Трактор бронируется только после подтверждения оплаты, а не раньше.","de":"Jede Anfrage wird nach Zahlungseingang bestätigt (Bankdaten werden per E-Mail mitgeteilt). Der Traktor wird erst nach Zahlungsbestätigung reserviert, nicht vorher.","fr":"Toute demande est confirmée après réception du paiement (IBAN communiqué par email). Le tracteur est bloqué à la confirmation du paiement, pas avant.","pl":"Każde zgłoszenie jest potwierdzane po otrzymaniu płatności (dane do przelewu przesyłane e-mailem). Ciągnik jest blokowany dopiero po potwierdzeniu płatności, nie wcześniej.","uk":"Кожен запит підтверджується після отримання оплати (реквізити надсилаються електронною поштою). Трактор бронюється лише після підтвердження оплати, а не раніше.","it":"Ogni richiesta viene confermata dopo la ricezione del pagamento (IBAN comunicato via email). Il trattore viene bloccato solo alla conferma del pagamento, non prima.","ro":"Fiecare cerere este confirmată după primirea plății (datele bancare sunt comunicate prin email). Tractorul este blocat doar la confirmarea plății, nu înainte.","cs":"Každá žádost je potvrzena po přijetí platby (údaje pro platbu zasíláme e-mailem). Traktor je rezervován až po potvrzení platby, ne dříve.","hu":"Minden kérelem a fizetés beérkezése után kerül megerősítésre (a banki adatokat e-mailben küldjük el). A traktor csak a fizetés megerősítése után van lefoglalva, nem korábban.","es":"Toda solicitud se confirma tras la recepción del pago (los datos bancarios se envían por email). El tractor queda bloqueado solo cuando se confirma el pago, no antes."},"terms_s3_title":{"en":"3. Cancellation","ru":"3. Отмена","de":"3. Stornierung","fr":"3. Annulation","pl":"3. Anulowanie","uk":"3. Скасування","it":"3. Cancellazione","ro":"3. Anulare","cs":"3. Zrušení","hu":"3. Lemondás","es":"3. Cancelación"},"terms_s3_body_tpl":{"en":"Any cancellation request must be sent by email to {adminEmail}. Refund conditions depend on how far in advance of the start date the request is made.","ru":"Заявку на отмену необходимо направить по email на {adminEmail}. Условия возврата средств зависят от того, за сколько дней до начала аренды подана заявка.","de":"Jede Stornierungsanfrage muss per E-Mail an {adminEmail} gesendet werden. Die Rückerstattungsbedingungen hängen davon ab, wie weit im Voraus vor dem Startdatum storniert wird.","fr":"Toute demande d'annulation doit être adressée par email à {adminEmail}. Les conditions de remboursement dépendent du délai avant la date de début.","pl":"Każde żądanie anulowania należy przesłać e-mailem na adres {adminEmail}. Warunki zwrotu zależą od czasu pozostałego do daty rozpoczęcia.","uk":"Будь-який запит на скасування слід надсилати електронною поштою на {adminEmail}. Умови повернення коштів залежать від того, за скільки днів до дати початку подано запит.","it":"Ogni richiesta di cancellazione deve essere inviata via email a {adminEmail}. Le condizioni di rimborso dipendono dal preavviso rispetto alla data di inizio.","ro":"Orice cerere de anulare trebuie trimisă prin email la {adminEmail}. Condițiile de rambursare depind de intervalul de timp rămas până la data de început.","cs":"Jakoukoli žádost o zrušení je třeba zaslat e-mailem na adresu {adminEmail}. Podmínky vrácení peněz závisí na době před datem zahájení.","hu":"Bármely lemondási kérelmet e-mailben kell elküldeni a {adminEmail} címre. A visszatérítés feltételei attól függenek, mennyivel a kezdő dátum előtt érkezik a kérelem.","es":"Toda solicitud de cancelación debe enviarse por email a {adminEmail}. Las condiciones de reembolso dependen del plazo antes de la fecha de inicio."},"terms_s4_title":{"en":"4. Condition of the equipment","ru":"4. Состояние техники","de":"4. Zustand der Ausrüstung","fr":"4. État du matériel","pl":"4. Stan sprzętu","uk":"4. Стан техніки","it":"4. Stato del mezzo","ro":"4. Starea echipamentului","cs":"4. Stav zařízení","hu":"4. Az eszköz állapota","es":"4. Estado del equipo"},"terms_s4_body":{"en":"The tractor is delivered in good working order. The renter agrees to return it in the same condition; otherwise, refurbishment costs may be charged.","ru":"Трактор передаётся в исправном рабочем состоянии. Арендатор обязуется вернуть его в том же состоянии, в противном случае может быть выставлен счёт за восстановительный ремонт.","de":"Der Traktor wird in einwandfreiem, funktionsfähigem Zustand übergeben. Der Mieter verpflichtet sich, ihn im gleichen Zustand zurückzugeben, andernfalls können Instandsetzungskosten in Rechnung gestellt werden.","fr":"Le tracteur est livré en bon état de fonctionnement. Le locataire s'engage à le restituer dans le même état, à défaut des frais de remise en état pourront être facturés.","pl":"Ciągnik jest dostarczany w dobrym stanie technicznym. Najemca zobowiązuje się zwrócić go w tym samym stanie, w przeciwnym razie mogą zostać naliczone koszty naprawy.","uk":"Трактор передається в справному робочому стані. Орендар зобов'язується повернути його в такому ж стані, інакше можуть бути стягнені витрати на відновлення.","it":"Il trattore viene consegnato in buone condizioni di funzionamento. Il locatario si impegna a restituirlo nelle stesse condizioni, altrimenti potranno essere addebitati costi di ripristino.","ro":"Tractorul este livrat în stare bună de funcționare. Chiriașul se angajează să îl returneze în aceeași stare, în caz contrar putând fi facturate costuri de reparație.","cs":"Traktor je předán v dobrém provozním stavu. Nájemce se zavazuje jej vrátit ve stejném stavu, jinak mu mohou být účtovány náklady na uvedení do původního stavu.","hu":"A traktort jó üzemi állapotban adjuk át. A bérlő vállalja, hogy ugyanabban az állapotban adja vissza, ellenkező esetben helyreállítási költséget számolhatunk fel.","es":"El tractor se entrega en buen estado de funcionamiento. El arrendatario se compromete a devolverlo en el mismo estado; de lo contrario, podrán facturarse gastos de reparación."},"terms_s5_title":{"en":"5. Liability","ru":"5. Ответственность","de":"5. Haftung","fr":"5. Responsabilité","pl":"5. Odpowiedzialność","uk":"5. Відповідальність","it":"5. Responsabilità","ro":"5. Răspundere","cs":"5. Odpovědnost","hu":"5. Felelősség","es":"5. Responsabilidad"},"terms_s5_body":{"en":"The renter is responsible for the equipment throughout the rental period and must use it in accordance with its intended purpose.","ru":"Арендатор несёт ответственность за технику на протяжении всего срока аренды и обязан использовать её по назначению.","de":"Der Mieter ist für die Ausrüstung während der gesamten Mietdauer verantwortlich und muss sie bestimmungsgemäß verwenden.","fr":"Le locataire est responsable du matériel pendant toute la durée de la location et doit l'utiliser conformément à sa destination.","pl":"Najemca odpowiada za sprzęt przez cały okres najmu i musi go użytkować zgodnie z przeznaczeniem.","uk":"Орендар несе відповідальність за техніку протягом усього строку оренди і повинен використовувати її за призначенням.","it":"Il locatario è responsabile del mezzo per tutta la durata del noleggio e deve utilizzarlo in conformità alla sua destinazione.","ro":"Chiriașul este responsabil de echipament pe toată durata închirierii și trebuie să îl folosească conform destinației sale.","cs":"Nájemce odpovídá za zařízení po celou dobu pronájmu a musí jej používat v souladu s jeho určením.","hu":"A bérlő felelős az eszközért a bérlet teljes időtartama alatt, és rendeltetésének megfelelően köteles használni.","es":"El arrendatario es responsable del equipo durante todo el período de alquiler y debe utilizarlo conforme a su destino."},"terms_disclaimer":{"en":"⚠️ Generic template provided for guidance only. Have this text validated by a legal professional before commercial launch.","ru":"⚠️ Типовой шаблон, предоставленный в качестве ориентира. Перед коммерческим запуском проверьте этот текст у юриста.","de":"⚠️ Generische Vorlage, nur zur Orientierung. Lassen Sie diesen Text vor der kommerziellen Nutzung von einem Rechtsexperten prüfen.","fr":"⚠️ Modèle générique fourni à titre indicatif. Faites valider ce texte par un professionnel du droit avant mise en ligne commerciale.","pl":"⚠️ Ogólny wzór podany wyłącznie orientacyjnie. Przed uruch function translate(lang, key, vars) {
  const entry = TRANSLATIONS[key];
  let str = (entry && (entry[lang] || entry.en)) || key;
  if (vars) {
    Object.keys(vars).forEach((k) => { str = str.split('{' + k + '}').join(vars[k]); });
  }
  return str;
}

function detectInitialLang() {
  try {
    const saved = localStorage.getItem('tractorrent_lang');
    if (saved && TRANSLATIONS.nav_admin[saved]) return saved;
  } catch (e) {}
  try {
    const nav = (navigator.language || navigator.userLanguage || 'en').slice(0, 2).toLowerCase();
    if (TRANSLATIONS.nav_admin[nav]) return nav;
  } catch (e) {}
  return 'en';
}

const ImageSlider = React.memo(({ images, alt, lang }) => {
  const tt = (key, vars) => translate(lang, key, vars);
  const [currentIndex, setCurrentIndex] = React.useState(0);
  const [touchStart, setTouchStart] = React.useState(0);
  const [touchEnd, setTouchEnd] = React.useState(0);
  const [imageErrors, setImageErrors] = React.useState({});
  const [isLightboxOpen, setIsLightboxOpen] = React.useState(false);

  const handleTouchStart = (e) => setTouchStart(e.targetTouches[0].clientX);
  const handleTouchMove = (e) => setTouchEnd(e.targetTouches[0].clientX);
  const handleTouchEnd = () => {
    if (touchStart - touchEnd > 50) handleNext();
    if (touchStart - touchEnd < -50) handlePrev();
  };

  const handleNext = (e) => { if (e) e.stopPropagation(); setCurrentIndex((prev) => (prev + 1) % images.length); };
  const handlePrev = (e) => { if (e) e.stopPropagation(); setCurrentIndex((prev) => (prev - 1 + images.length) % images.length); };

  const handleImageError = (idx) => {
    setImageErrors(prev => ({ ...prev, [idx]: true }));
  };

  // Ouverture quasi instantanée : l'image est déjà chargée dans le carrousel,
  // le lightbox ne fait qu'afficher le même <img> en grand, sans nouveau chargement réseau.
  React.useEffect(() => {
    if (!isLightboxOpen) return;
    const onKeyDown = (e) => {
      if (e.key === 'Escape') setIsLightboxOpen(false);
      if (e.key === 'ArrowRight') handleNext();
      if (e.key === 'ArrowLeft') handlePrev();
    };
    document.addEventListener('keydown', onKeyDown);
    return () => document.removeEventListener('keydown', onKeyDown);
  }, [isLightboxOpen, images.length]);

  return (
    <div style={{ position: 'relative', width: '100%', height: '180px', backgroundColor: '#2a2a2a', borderRadius: '12px', overflow: 'hidden', userSelect: 'none' }} 
         onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd}>
      {imageErrors[currentIndex] ? (
        <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '60px', backgroundColor: '#1a1a1a' }}>🚜</div>
      ) : (
        <img src={images[currentIndex]} alt={alt || tt('slider_altDefault')} loading="lazy" style={{ width: '100%', height: '100%', objectFit: 'cover', cursor: 'zoom-in' }}
             onClick={() => setIsLightboxOpen(true)} onError={() => handleImageError(currentIndex)} />
      )}
      {!imageErrors[currentIndex] && (
        <div onClick={() => setIsLightboxOpen(true)} role="button" tabIndex={0} aria-label={tt('slider_zoom')}
             style={{ position: 'absolute', top: '8px', right: '8px', backgroundColor: 'rgba(0,0,0,0.55)', color: '#fff', width: '26px', height: '26px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '13px', cursor: 'zoom-in', zIndex: 10, pointerEvents: 'none' }}>🔍</div>
      )}
      {images[currentIndex] && images[currentIndex].includes('images.unsplash.com') && (
        <div style={{ position: 'absolute', top: '8px', left: '8px', backgroundColor: 'rgba(245,158,11,0.9)', color: '#1a1a1a', fontSize: '10px', fontWeight: 700, padding: '3px 8px', borderRadius: '5px', zIndex: 10, pointerEvents: 'none' }}>
          {tt('slider_illustration')}
        </div>
      )}
      <button onClick={handlePrev} aria-label={tt('slider_prev')} style={{ position: 'absolute', left: '8px', top: '50%', transform: 'translateY(-50%)', backgroundColor: 'rgba(0,0,0,0.5)', border: 'none', color: 'white', padding: '8px 12px', borderRadius: '50%', cursor: 'pointer', zIndex: 10 }}>❮</button>
      <button onClick={handleNext} aria-label={tt('slider_next')} style={{ position: 'absolute', right: '8px', top: '50%', transform: 'translateY(-50%)', backgroundColor: 'rgba(0,0,0,0.5)', border: 'none', color: 'white', padding: '8px 12px', borderRadius: '50%', cursor: 'pointer', zIndex: 10 }}>❯</button>
      <div style={{ position: 'absolute', bottom: '10px', left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: '6px', zIndex: 10 }}>
        {images.map((_, idx) => (
          <div key={idx} style={{ width: '6px', height: '6px', borderRadius: '50%', backgroundColor: idx === currentIndex ? '#1b9842' : 'rgba(255,255,255,0.5)' }} />
        ))}
      </div>

      {isLightboxOpen && !imageErrors[currentIndex] && (
        <div onClick={() => setIsLightboxOpen(false)} role="dialog" aria-modal="true" aria-label={tt('slider_photoAria')}
             style={{ position: 'fixed', inset: 0, backgroundColor: 'rgba(0,0,0,0.94)', zIndex: 2000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px', animationDuration: '0ms' }}>
          <span onClick={(e) => { e.stopPropagation(); setIsLightboxOpen(false); }} role="button" tabIndex={0} aria-label={tt('slider_close')}
                style={{ position: 'absolute', top: '18px', right: '20px', color: '#fff', fontSize: '28px', cursor: 'pointer', lineHeight: 1 }}>✕</span>
          <img src={images[currentIndex]} alt={alt || tt('slider_altDefault')} onClick={(e) => e.stopPropagation()}
               style={{ maxWidth: '94%', maxHeight: '88vh', objectFit: 'contain', borderRadius: '6px' }} />
          {images.length > 1 && (
            <>
              <button onClick={handlePrev} aria-label={tt('slider_prev')} style={{ position: 'absolute', left: '10px', top: '50%', transform: 'translateY(-50%)', backgroundColor: 'rgba(255,255,255,0.15)', border: 'none', color: 'white', padding: '10px 16px', borderRadius: '50%', cursor: 'pointer', fontSize: '18px' }}>❮</button>
              <button onClick={handleNext} aria-label={tt('slider_next')} style={{ position: 'absolute', right: '10px', top: '50%', transform: 'translateY(-50%)', backgroundColor: 'rgba(255,255,255,0.15)', border: 'none', color: 'white', padding: '10px 16px', borderRadius: '50%', cursor: 'pointer', fontSize: '18px' }}>❯</button>
              <div style={{ position: 'absolute', bottom: '22px', left: '50%', transform: 'translateX(-50%)', color: '#fff', fontSize: '12px', opacity: 0.7 }}>{currentIndex + 1} / {images.length}</div>
            </>
          )}
        </div>
      )}
    </div>
  );
});

function ChatWidget({ settings, isChatOpen, setIsChatOpen, chatMessages, setChatMessages, chatInput, setChatInput, isAiLoading, setIsAiLoading, lang }) {
  const tt = (key, vars) => translate(lang, key, vars);
  const handleSendMessage = async () => {
    if (!chatInput.trim()) return;
    const userMessage = { role: 'user', content: chatInput };
    setChatMessages(prev => [...prev, userMessage]);
    setChatInput('');
    setIsAiLoading(true);

    if (!settings.openAiApiKey) {
      setTimeout(() => {
        setChatMessages(prev => [...prev, { role: 'assistant', content: tt('chat_notConfigured') }]);
        setIsAiLoading(false);
      }, 1200);
      return;
    }
    try {
      const response = await fetch(settings.iaAgentApiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${settings.openAiApiKey}` },
        body: JSON.stringify({ model: "gpt-3.5-turbo", messages: [{ role: "system", content: settings.iaAgentSystemMessage }, ...chatMessages, userMessage] })
      });
      const data = await response.json();
      if (data.choices && data.choices.length > 0) {
        setChatMessages(prev => [...prev, { role: 'assistant', content: data.choices[0].message.content }]);
      } else { setChatMessages(prev => [...prev, { role: 'assistant', content: tt('chat_errorResponse') }]); }
    } catch (error) { setChatMessages(prev => [...prev, { role: 'assistant', content: tt('chat_errorConnection') }]); }
    setIsAiLoading(false);
  };

  return (
    <div style={{ position: 'fixed', bottom: '20px', right: '20px', zIndex: 999 }}>
      <div onClick={() => setIsChatOpen(!isChatOpen)} role="button" tabIndex={0} aria-label={isChatOpen ? tt('chat_toggleClose') : tt('chat_openAria')}
        onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') setIsChatOpen(!isChatOpen); }}
        style={{ backgroundColor: settings.primaryColor, width: '65px', height: '65px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', boxShadow: '0 8px 25px rgba(0,0,0,0.6)' }}>
        <span style={{ fontSize: '32px', color: '#fff' }}>🤖</span>
      </div>
      {isChatOpen && (
        <div style={{ position: 'absolute', bottom: '80px', right: '0', width: '320px', height: '450px', backgroundColor: '#262626', borderRadius: '16px', boxShadow: '0 10px 40px rgba(0,0,0,0.8)', display: 'flex', flexDirection: 'column', overflow: 'hidden', border: '1px solid #444' }}>
          <div style={{ padding: '15px', backgroundColor: settings.primaryColor, color: '#fff', fontWeight: 'bold', display: 'flex', justifyContent: 'space-between' }}>
            <span>{tt('chat_title')}</span>
            <span onClick={() => setIsChatOpen(false)} role="button" tabIndex={0} aria-label={tt('chat_closeAria')} style={{ cursor: 'pointer' }}>✕</span>
          </div>
          <div style={{ flex: 1, padding: '15px', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '10px', backgroundColor: '#1f1f1f' }}>
            {chatMessages.map((msg, idx) => (
              <div key={idx} style={{ alignSelf: msg.role === 'user' ? 'flex-end' : 'flex-start', maxWidth: '80%', padding: '10px 15px', borderRadius: '12px', backgroundColor: msg.role === 'user' ? settings.primaryColor : '#333', color: '#fff', fontSize: '14px' }}>
                {msg.content}
              </div>
            ))}
            {isAiLoading && <div style={{ alignSelf: 'flex-start', color: '#888', fontSize: '12px' }}>{tt('chat_thinking')}</div>}
          </div>
          <div style={{ padding: '10px', borderTop: '1px solid #444', display: 'flex', gap: '10px', backgroundColor: '#262626' }}>
            <input value={chatInput} onChange={(e) => setChatInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()} placeholder={tt('chat_placeholder')} style={{ flex: 1, padding: '10px', borderRadius: '8px', border: 'none', backgroundColor: '#1a1a1a', color: '#fff', fontSize: '14px', outline: 'none' }} />
            <button onClick={handleSendMessage} style={{ backgroundColor: settings.primaryColor, border: 'none', padding: '0 15px', borderRadius: '8px', color: '#fff', fontWeight: 'bold', cursor: 'pointer' }}>{tt('chat_send')}</button>
          </div>
        </div>
      )}
    </div>
  );
}

    const key = SPEC_LABEL_KEYS[rawLabel];

  // Convertit la saisie (jours OU mois) en un nombre de jours réel utilisé pour le prix,
  // la vérification de conflit et l'enregistrement — 1 mois = 30 jours (approximation standard).
  const getEffectiveDays = () => {
    const raw = parseInt(bookingData.days, 10) || 0;
    if (bookingData.durationUnit === 'months') return raw * 30;
    if (bookingData.durationUnit === 'weeks') return raw * 7;
    return raw;
  };
  const calculateTotal = () => {
    if (!selectedTractor) return 0;
    return selectedTractor.pricePerDay * getEffectiveDays();

  const recordReservation = (statusLabel) => {

      if (data) setLastReservationId(data.id);
      return data ? data.id : null;
